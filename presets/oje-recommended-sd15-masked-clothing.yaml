# Oje's recommended SD1.5 masked clothing LoRA configuration (for Clip skip 2 / anime & merged checkpoints)
# Load this file from Costume LoRA Studio -> LoRA -> Configuration -> Import YAML / JSON
schema_version: 1
name: Oje Recommended — SD1.5 Masked Clothing (Clip skip 2)
model_family: sd15
parameters:
  resolution: 512
  batch_size: 2
  repeats: 8
  epochs: 12
  steps: 0
  save_every_n_epochs: 1
  optimizer: AdamW8bit
  optimizer_args: ""
  learning_rate: 0.00015
  text_encoder_lr: 0.00005
  lr_scheduler: cosine
  lr_warmup_percent: 5
  lr_scheduler_num_cycles: 1
  rank: 32
  alpha: 16
  mixed_precision: fp16
  seed: 42
  min_snr_gamma: 5
  noise_offset: 0.05
  clip_skip: 2
  shuffle_caption: true
  keep_tokens: 1
  use_masks: true
  alpha_mask: false
  gradient_checkpointing: true
  fp8_base: false
  blocks_to_swap: 0
sample:
  every_n_epochs: 1
  checkpoint: ""
  lora_strength: 0.8
  width: 512
  height: 680
  steps: 20
  cfg: 7
  sampler: dpmsolver++
  clip_skip: 2
  seed: 42
  prompt: |-
    burumaGymUniform, 1girl, solo, from front, knee level shot, standing, looking at viewer, simple background
    burumaGymUniform, 1girl, solo, from behind, full body, standing, looking back, simple background
  negative: worst quality, low quality, bad anatomy
